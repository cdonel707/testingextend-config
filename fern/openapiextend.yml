  /files:
    get:
      tags:
        - File Endpoints
      summary: List Files
      description: List files in your account. Files represent documents that have been uploaded to Extend.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: nameContains
          in: query
          schema:
            type: string
          description: Filters files by the name of the file
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sorts the files in ascending or descending order
        - name: nextPageToken
          in: query
          schema:
            type: string
          description: |
            The token used to fetch the page of results from a previous request. We use cursor based pagination and will return a `nextPageToken` in the response if there are more results.

            Note: If parameters other than `nextPageToken` change in subsequence requests, you are likely to receive incomplete results.

            Example: `"xK9mLPqRtN3vS8wF5hB2cQ==:zWvUxYjM4nKpL7aDgE9HbTcR2mAyX3/Q+CNkfBSw1dZ="`
        - name: maxPageSize
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 1000
          description: The maximum number of results to return in the response.
      responses:
        '200':
          description: Successfully retrieved files
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  nextPageToken:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
    post:
      tags:
        - File Endpoints
      summary: Create File (Deprecated)
