  /parse:
    post:
      tags:
        - Parse Endpoints
      summary: Parse File
      description: Parse files to get cleaned, chunked target content (e.g. markdown)
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file
                - config
              properties:
                file:
                  type: object
                  properties:
                    fileName:
                      type: string
                      description: The name of the file. If not set, the file name is taken from the url.
                    fileUrl:
                      type: string
                      description: A URL to download the file. For production use cases, we recommend using presigned URLs with a 5-15 minute expiration time. One of `fileUrl` or `fileId` must be provided.
                    fileId:
                      type: string
                      description: |
                        If you already have an Extend file id (for instance from running a workflow or a previous file upload) then you can use that file id when running the parse endpoint so that it leverage any cached data that might be available. The file id will start with "file_". One of `fileUrl` or `fileId` must be provided.

                        Example: `"file_xK9mLPqRtN3vS8wF5hB2cQ"`
                config:
                  type: object
                  properties:
                    target:
                      type: string
                      enum: [markdown, spatial]
                      default: markdown
                      description: The target format for the parsed content
                    chunkingStrategy:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [page, document, section]
                          default: page
                          description: The type of chunking strategy
                        minCharacters:
                          type: integer
                          description: Minimum number of characters per chunk
                        maxCharacters:
                          type: integer
                          description: Maximum number of characters per chunk
                    blockOptions:
                      type: object
                      properties:
                        figures:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            figureImageClippingEnabled:
                              type: boolean
                              default: true
                        tables:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            targetFormat:
                              type: string
                              enum: [markdown, html]
                              default: markdown
                        text:
                          type: object
                          properties:
                            signatureDetectionEnabled:
                              type: boolean
                              default: true
                    advancedOptions:
                      type: object
                      properties:
                        pageRotationEnabled:
                          type: boolean
                          default: true
      responses:
        '200':
          description: Successfully parsed file
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  parsedFile:
                    $ref: '#/components/schemas/ParsedFile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

